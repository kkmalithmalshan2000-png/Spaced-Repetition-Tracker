name: Integrate FSRS
# This workflow is intentionally manual-only and read-only.
# Generated changes must be reviewed and merged through a pull request.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify FSRS bundle and integration
        run: |
          test -f fsrs-bundle.js || { echo "fsrs-bundle.js is missing from the repo root"; exit 1; }
          grep -q "fsrs-bundle.js" index.html || { echo "index.html does not reference fsrs-bundle.js"; exit 1; }
