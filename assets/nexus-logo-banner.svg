<svg xmlns="http://www.w3.org/2000/svg" width="620" height="184" viewBox="0 0 620 184" role="img" aria-labelledby="title desc">
<title id="title">NEXUS — Spaced Repetition Tracker</title>
<desc id="desc">The original NEXUS logo: four glowing cyan-to-purple nodes joined by an interwoven ribbon symbol, with NEXUS and Spaced Repetition Tracker to the right.</desc>
<defs>
 <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#54f2df"/><stop offset=".48" stop-color="#59bfe9"/><stop offset="1" stop-color="#a35aff"/></linearGradient>
 <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#59eadc"/><stop offset=".45" stop-color="#65c9ed"/><stop offset="1" stop-color="#a77bff"/></linearGradient>
 <filter id="softGlow" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Four circular terminals and the interwoven, broad ribbon mark -->
<g transform="translate(8 13)" filter="url(#softGlow)">
 <g fill="none" stroke="url(#nodeGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
  <path d="M31 31 C58 38 83 55 107 79 C97 102 80 121 53 137 C35 121 24 101 20 79"/>
  <path d="M119 32 C110 59 95 83 74 105 C55 95 38 78 28 57"/>
  <path d="M24 78 C38 54 58 39 84 30 C99 45 111 61 119 80"/>
  <path d="M20 80 C38 101 61 118 87 127 C100 115 110 99 117 79"/>
  <path d="M54 137 C68 117 82 97 95 74"/>
 </g>
 <circle cx="31" cy="31" r="18" fill="#57f0df"/>
 <circle cx="119" cy="32" r="18" fill="#8c8bff"/>
 <circle cx="20" cy="137" r="18" fill="#61c9f0"/>
 <circle cx="112" cy="129" r="18" fill="#a65bff"/>
</g>
<text x="158" y="91" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="700" letter-spacing="1.2" fill="url(#wordGrad)">NEXUS</text>
<text x="161" y="126" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#c7c6cf">Spaced Repetition Tracker</text>
</svg>