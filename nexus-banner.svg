<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-labelledby="title desc">
<title id="title">Nexus Spaced Repetition Tracker</title>
<desc id="desc">Nexus branding with a blue, cyan and violet interlocking symbol on a deep navy gradient.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090d1c"/><stop offset=".58" stop-color="#070912"/><stop offset="1" stop-color="#11102a"/></linearGradient>
 <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a17aff"/><stop offset=".52" stop-color="#4f83ff"/><stop offset="1" stop-color="#00d8d0"/></linearGradient>
 <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect x="1" y="1" width="958" height="188" rx="28" fill="url(#bg)" stroke="#292b56" stroke-opacity=".75" stroke-width="2"/>
<ellipse cx="105" cy="20" rx="105" ry="55" fill="#5149ff" opacity=".16" filter="url(#glow)"/>
<image href="./icon-192.png" x="22" y="19" width="152" height="152" preserveAspectRatio="xMidYMid meet"/>
<text x="202" y="83" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="51" font-weight="760" letter-spacing="-1.4" fill="#ffffff">Nexus <tspan font-weight="580">Spaced Repetition</tspan></text>
<text x="205" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" letter-spacing="13" fill="url(#titleGrad)">TRACKER</text>
<path d="M205 151 H564" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" opacity=".7"/>
</svg>